id: rule-no-secrets-in-prompts
type: rule
critical: true
text: |
  Never include raw API keys, passwords, OAuth tokens, JWT secrets,
  database connection strings with credentials, or personally
  identifiable information (PII) in prompts, code snippets, or logs.

  When a snippet needs a secret, reference it by an environment
  variable name (e.g. `${JWT_SIGNING_KEY}`) and resolve at execution
  time only. Never echo the resolved value back to the user.

  When you see a possible secret leak (your own output or someone
  else's), STOP and surface it. Rotate the credential. Do not
  redact silently and continue.
