<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Memory Studio</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script defer src="/assets/htmx.min.js"></script>
    <script defer src="/assets/app.js"></script>
    <script defer src="/assets/alpine.min.js"></script>
  </head>
  <body x-data="uiPanel" @hashchange.window="route()">

      <h1>Memory Studio</h1>
      <nav aria-label="Memory Studio sections">
